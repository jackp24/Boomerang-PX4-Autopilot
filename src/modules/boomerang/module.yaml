__max_num_config_instances: 1

module_name: Boomerang

parameters:
  - group: Boomerang
    definitions:

      BC_CYC_PHASE:
        description:
          short: Cyclic mixer phase advance
          long: |
            Phase lead angle (radians) added to blade azimuth before computing
            the despin transform.  Compensates for servo actuation lag and
            gyroscopic precession of the rotor disk.

            Start at 0.0.  If pushing the pitch stick forward causes the vehicle
            to move sideways instead of forward, increase by ~0.52 rad (30°)
            and re-test.  Typical range: 0.0 – 1.57 rad (0° – 90°).
        type: float
        unit: rad
        min: -3.14
        max:  3.14
        decimal: 3
        increment: 0.052
        default: 0.0
        reboot_required: false

      BC_CYC_MAX_DEF:
        description:
          short: Maximum cyclic flap deflection
          long: |
            Ceiling on the normalised flap command sent to each servo.
            1.0 = full servo range (as configured in the output driver).
            0.5 = 50% of range.  Keep at 0.5 or lower during initial tuning
            to limit cyclic authority while verifying correct direction.
        type: float
        unit: ''
        min: 0.0
        max: 1.0
        decimal: 2
        increment: 0.05
        default: 0.5
        reboot_required: false

      BC_RPM_MIN:
        description:
          short: Minimum rotor RPM (armed)
          long: |
            Minimum RPM commanded to all four blade motors while the vehicle
            is armed.  Must be above the aerodynamic minimum for blade lift.
            Motors never spin below this value when armed.
        type: float
        unit: rpm
        min: 0.0
        max: 400.0
        decimal: 0
        increment: 10.0
        default: 200.0
        reboot_required: false

      BC_RPM_MAX:
        description:
          short: Maximum rotor RPM
          long: |
            Hard ceiling on collective RPM.  Protects blade structure and
            motor ratings.  The thrust setpoint from mc_pos_control is mapped
            linearly between BC_RPM_MIN and BC_RPM_MAX.
        type: float
        unit: rpm
        min: 0.0
        max: 400.0
        decimal: 0
        increment: 10.0
        default: 320.0
        reboot_required: false

      BC_RPM_HOVER:
        description:
          short: Hover / trim RPM
          long: |
            Nominal RPM at which the vehicle hovers.  Used as the trim point
            when no thrust setpoint is available (e.g. during startup or
            manual mode without altitude hold).  Set to the RPM measured
            during a steady hover on the first flight.
        type: float
        unit: rpm
        min: 0.0
        max: 400.0
        decimal: 0
        increment: 5.0
        default: 260.0
        reboot_required: false

      BC_VIRT_HDG:
        description:
          short: Virtual heading (NED, radians)
          long: |
            The NED yaw angle that is published as the vehicle's heading to
            the rest of the PX4 stack.  Captured automatically at startup
            by averaging EKF2 yaw over ~0.25 s.  This value is overwritten
            at each boot; modifying it in QGC only takes effect if the
            heading capture fails.
        type: float
        unit: rad
        min: -3.1416
        max:  3.1416
        decimal: 4
        increment: 0.01
        default: 0.0
        reboot_required: false

      BC_PILOT_EXPO:
        description:
          short: Pilot stick expo (manual / stabilised mode)
          long: |
            Expo coefficient applied to pitch/roll sticks in manual/stabilised
            mode (when mc_rate_control is not providing a torque setpoint).
            f(x) = expo * x^3 + (1 - expo) * x.
            0.0 = fully linear.  0.3 = mild expo (recommended starting point).
            1.0 = full cubic (very centre-sensitive).
        type: float
        unit: ''
        min: 0.0
        max: 1.0
        decimal: 2
        increment: 0.05
        default: 0.3
        reboot_required: false

      BC_TILT_MAX:
        description:
          short: Maximum tilt in Stabilised mode
          long: |
            Maximum roll/pitch angle commanded when the stick is at full
            deflection in Stabilised mode.  In Position mode this is
            overridden by MPC_MAN_TILT_MAX.  Keep small (≤ 15°) until the
            vehicle response direction is confirmed.
        type: float
        unit: rad
        min: 0.05
        max: 0.785
        decimal: 3
        increment: 0.017
        default: 0.262
        reboot_required: false

      BC_ALT_RATE_MAX:
        description:
          short: Maximum altitude rate in Altitude mode
          long: |
            Maximum vertical speed (m/s) when the throttle stick is at full
            up or full down in Altitude hold mode.  In Position mode the
            MPC_Z_VEL_MAX_UP / MPC_Z_VEL_MAX_DN parameters govern this.
        type: float
        unit: m/s
        min: 0.0
        max: 5.0
        decimal: 1
        increment: 0.1
        default: 2.0
        reboot_required: false

      BC_T_ROLL_GAIN:
        description:
          short: Roll torque → cyclic gain
          long: |
            Scales mc_rate_control's normalised roll torque output
            (vehicle_torque_setpoint.xyz[0]) into the [-1, 1] cyclic roll
            demand fed to CyclicMixer.

            mc_rate_control outputs torque in the range ≈ [-1, 1] based on
            the rate error and its PID gains.  This gain is a post-multiplier
            that adjusts how much of that torque demand is translated to flap
            deflection.  Start at 1.0 and increase if the roll response feels
            weak, or decrease if it oscillates.

            Tuning order: set BC_TORQUE_PITCH_GAIN to the same value and tune
            both together first, then trim the ratio between axes if needed.
        type: float
        unit: ''
        min: 0.0
        max: 20.0
        decimal: 2
        increment: 0.1
        default: 4.0
        reboot_required: false

      BC_T_PITCH_GAIN:
        description:
          short: Pitch torque → cyclic gain
          long: |
            Scales mc_rate_control's normalised pitch torque output
            (vehicle_torque_setpoint.xyz[1]) into the [-1, 1] cyclic pitch
            demand fed to CyclicMixer.

            See BC_TORQUE_ROLL_GAIN for tuning guidance.  Pitch and roll
            aerodynamic authority are usually similar for a symmetric 4-blade
            rotor so the two gains should end up close to each other.
        type: float
        unit: ''
        min: 0.0
        max: 20.0
        decimal: 2
        increment: 0.1
        default: 4.0
        reboot_required: false

      BMG_LED_WIN:
        description:
          short: Heading LED window half-width
        type: float
        unit: deg
        default: 10.0
        min: 1.0
        max: 45.0
